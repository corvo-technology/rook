server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  add_header Link '</llms.txt>; rel="describedby"; type="text/plain", </.well-known/ai-catalog.json>; rel="ai-catalog"; type="application/ai-catalog+json"' always;

  if ($host ~* ^(www\.rook\.team|rookup\.run|www\.rookup\.run|bots\.corvo\.tech|www\.bots\.corvo\.tech)$) {
    return 301 https://rook.team$request_uri;
  }

  location = /sitemap.xml {
    return 301 /sitemap-index.xml;
  }

  location = /.well-known/ai-catalog.json {
    default_type application/ai-catalog+json;
  }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
}
