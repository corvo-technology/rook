<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'none'; base-uri 'none'"
    />
    <title data-i18n="title">Set up Rook</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="titlebar-name">Rook</span>
      <div class="titlebar-actions">
      <button id="change-language" class="titlebar-quit" type="button" data-i18n="language" hidden>
        Language
      </button>
      <button id="quit" class="titlebar-quit" type="button" data-i18n="quit">Quit</button>
      </div>
    </header>

    <main id="step-language" class="shell" hidden>
      <img class="mascot" src="mascot.svg" width="56" height="56" alt="" />
      <h1 class="heading" data-i18n="chooseLanguage">Choose your language</h1>
      <form id="language-form" novalidate>
        <fieldset class="choices languages">
          <legend class="sr-only" data-i18n="chooseLanguage">Choose your language</legend>
        </fieldset>
        <div class="actions">
          <button id="language-continue" class="button button-primary" type="submit" data-i18n="continue">
            Continue
          </button>
        </div>
      </form>
    </main>

    <main id="step-setup" class="shell" hidden>
      <img class="mascot" src="mascot.svg" width="56" height="56" alt="" />
      <h1 class="heading" data-i18n="welcome">Welcome to Rook</h1>
      <p class="subheading" data-i18n="where">Where should Rook run?</p>

      <form id="setup" novalidate>
        <fieldset class="choices">
          <legend class="sr-only" data-i18n="instance">Where Rook runs</legend>

          <label class="choice" for="mode-new">
            <input id="mode-new" type="radio" name="mode" value="new" checked />
            <span class="choice-copy">
              <span class="choice-title" data-i18n="thisComputer">This computer</span>
              <span class="choice-desc" data-i18n="thisComputerDesc">Your data stays on this computer.</span>
            </span>
          </label>

          <label class="choice" for="mode-cloud">
            <input id="mode-cloud" type="radio" name="mode" value="cloud" disabled />
            <span class="choice-copy">
              <span class="choice-title" data-i18n="cloud">Rook Cloud</span>
              <span class="choice-desc" data-i18n="cloudDesc">We host it for you.</span>
            </span>
            <span class="choice-soon" data-i18n="soon">Soon</span>
          </label>

          <label class="choice" for="mode-existing">
            <input id="mode-existing" type="radio" name="mode" value="existing" />
            <span class="choice-copy">
              <span class="choice-title" data-i18n="existing">Existing server</span>
              <span class="choice-desc" data-i18n="existingDesc">Connect to a server your team runs.</span>
            </span>
          </label>
        </fieldset>

        <section id="panel-new" class="panel">
          <div id="stack" hidden>
            <div class="stack-head">
              <p id="stack-phase" class="stack-phase" role="status" aria-live="polite"></p>
              <button
                id="stack-details"
                class="icon-button"
                type="button"
                aria-controls="stack-output"
                aria-expanded="false"
                data-i18n-aria="details"
                data-i18n-title="details"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path d="M3.5 4.5 7 8l-3.5 3.5M8.5 11.5H13" />
                </svg>
              </button>
            </div>
            <div
              id="stack-progress"
              class="progress"
              role="progressbar"
              data-i18n-aria="progress"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              hidden
            >
              <div id="stack-progress-fill" class="progress-fill"></div>
            </div>
            <pre id="stack-output" class="stack-output" hidden></pre>
          </div>
        </section>

        <section id="panel-existing" class="panel" hidden>
          <label class="field-label" for="server-url" data-i18n="serverAddress">Server address</label>
          <input
            id="server-url"
            class="field"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="https://corvo.example.com"
          />
        </section>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div class="actions">
          <button id="check" class="button button-secondary" type="button" data-i18n="check">
            Check connection
          </button>
          <button id="continue" class="button button-primary" type="submit" data-i18n="continue">
            Continue
          </button>
        </div>
      </form>
    </main>

    <script src="setup-strings.js"></script>
    <script src="setup.js"></script>
  </body>
</html>
