<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel do parceiro</title>
    <style>
      body { margin: 0; display: flex; min-height: 100vh; background: #f6f7f9; color: #111827; font-family: Georgia, serif; font-size: 14px; }
      aside { width: 220px; flex: none; background: #fff; border-right: 1px solid #e5e7eb; padding: 18px 12px; }
      aside b { display: block; padding: 6px 10px 18px; font-size: 16px; }
      aside span { display: block; padding: 9px 12px; border-radius: 8px; color: inherit; text-decoration: none; }
      aside span[aria-current] { background: #f3f4f6; font-weight: 600; }
      main { flex: 1; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; }
      h1 { margin: 0; font-size: 24px; }
      .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; }
      .card small { display: block; color: #6b7280; }
      #log { color: #6b7280; }
      @media (max-width: 639px) { aside { display: none; } main { padding: 16px; } .cards { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <aside>
      <b>GreenBarber</b>
      <span>Agenda</span>
      <span aria-current="page">Clientes</span>
      <span>Serviços</span>
      <span>Financeiro</span>
    </aside>
    <main>
      <small>Clientes / Carlos Souza</small>
      <h1>Carlos Souza</h1>
      <div class="cards">
        <div class="card"><small>Última visita</small>há 34 dias</div>
        <div class="card"><small>Frequência</small>a cada 21 dias</div>
        <div class="card"><small>Preferido</small>Rafael</div>
      </div>
      <div id="log" data-testid="host-log"></div>
    </main>
    <script src="/sdk.js"></script>
    <script>
      // A partner's app shell: the launcher is mounted once, then told where the person is.
      const el = document.createElement("corvo-assistant");
      el.setAttribute("mode", "launcher");
      el.setAttribute("session-url", "/demo/session");
      el.setAttribute("origin", location.origin);
      el.setAttribute("locale", "pt-BR");
      el.setAttribute("accent", "#1f8a5b");
      el.setAttribute("radius", "10px");
      el.setAttribute("name", "Rook");
      const params = new URLSearchParams(location.search);
      if (params.get("theme")) el.setAttribute("theme", params.get("theme"));
      if (params.get("dock")) el.setAttribute("dock", params.get("dock"));
      // ?consultations=1 turns on the in-panel recorder for the patient on screen.
      const consultations = params.get("consultations");
      if (consultations) el.setAttribute("consultations", "");
      document.body.append(el);
      el.setContext({
        page: "/clientes/42",
        title: "Cliente",
        entities: [{ type: consultations ? "patient" : "customer", id: "42", label: "Carlos Souza" }],
      });
      el.setSuggestions(["Esse cliente está sumido?", "Resumo das últimas visitas", "Horários livres do Rafael"]);
      el.registerActions([
        {
          name: "open_agenda",
          description: "Abrir na agenda",
          params: { type: "object", properties: { day: { type: "string" } } },
        },
      ]);
      const log = document.getElementById("log");
      el.addEventListener("corvo-action", (event) => {
        log.textContent = `action:${event.detail.name}`;
        el.resolveAction(event.detail.id, { ok: true, message: "Aberto" });
      });
    </script>
  </body>
</html>
