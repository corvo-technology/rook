server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css text/markdown application/javascript application/json image/svg+xml application/xml;

  add_header Link '</llms.txt>; rel="describedby"; type="text/plain"' always;

  location ~ \.md$ {
    default_type text/markdown;
    add_header Link '</llms.txt>; rel="describedby"; type="text/plain"' always;
    try_files $uri =404;
  }

  location = /llms.txt {
    default_type text/plain;
  }

  location = /llms-full.txt {
    default_type text/plain;
  }

  # Hashed build assets and the search index chunks never change under the same name.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
}
