name: desktop-apps

# Builds the desktop app on macOS, Windows and Linux and, for a version tag, publishes the files
# as a GitHub release. The builds are not signed yet: add the signing secrets and use
# release-desktop.yml when there are certificates.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            args: --mac --universal -c.mac.identity=- -c.mac.notarize=false
          - name: Windows
            os: windows-2022
            args: --win --x64 -c.win.verifyUpdateCodeSignature=false
          - name: Linux
            os: ubuntu-24.04
            args: --linux --x64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            args: --linux --arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the desktop version $version." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://corvo:corvo@127.0.0.1:5433/corvo
      - run: pnpm --filter @corvo/web build
      - run: pnpm --filter @corvo/desktop build
      - name: Install fpm for the arm64 .deb
        # electron-builder only ships an x64 fpm, so arm64 uses the system one.
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby
          sudo gem install fpm --no-document
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        run: pnpm --filter @corvo/desktop exec electron-builder ${{ matrix.args }} --publish never
      - name: Verify the universal macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: apps/desktop/scripts/verify-mac-native.sh apps/desktop/out/mac-universal/Corvo.app
      - name: Verify the Linux app starts and carries the engine for this CPU
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find apps/desktop/out -maxdepth 1 -type d -name 'linux*unpacked' -print -quit)"
          "$app/resources/postgres/bin/postgres" --version
          ELECTRON_RUN_AS_NODE=1 "$app/corvo" -e 'console.log(process.arch)'
          test -n "$(find apps/desktop/out -maxdepth 1 -name 'corvo-linux-*.deb' -print -quit)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corvo-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/out/corvo-*
            apps/desktop/out/latest*.yml

  intel-smoke:
    # The universal app is built on Apple silicon; this opens it on an Intel Mac, which nothing else does.
    name: macOS Intel smoke
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: corvo-macos-15
          path: files
      - name: Run the native code on Intel
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          ditto -x -k files/corvo-mac-universal.zip app
          apps/desktop/scripts/verify-mac-native.sh app/Corvo.app

  release:
    name: Publish release
    needs: [build, intel-smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: files
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cp apps/desktop/install/install.sh apps/desktop/install/install.ps1 files/
          rm -f files/*.blockmap
          ( cd files && shasum -a 256 * > SHA256SUMS )
          ls -la files
          gh release create "$GITHUB_REF_NAME" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rook ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --latest \
            --notes "These builds are not signed yet, so macOS and Windows warn the first time you open the app. The install commands in the README skip the macOS warning."
